# DROP TABLE leaves snapshots; reclaim disk with: docker exec cassandra nodetool clearsnapshot --all
name: cassandra
# Single-node Cassandra. Host port 9043 because 9042 is used by the other databases.
# Run: docker compose -f src/NBomber.YCSB/CassandraDb/docker-compose.yml up -d --wait
# Benchmark: --db cassandra (cassandra.port=9043, cassandra.replicationfactor=1 by default).
services:

  cassandra:
    image: cassandra:5.0.9
    container_name: cassandra
    ports:
      - "127.0.0.1:9043:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: ycsb
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
      # The driver reaches the node through the mapped host port, not the container IP.
      CASSANDRA_BROADCAST_RPC_ADDRESS: 127.0.0.1
    mem_limit: 1536m
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      start_period: 120s
      interval: 10s
      timeout: 10s
      retries: 12

volumes:
  cassandra_data:
    driver: local
